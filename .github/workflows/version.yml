name: version

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Repo publico: GitHub no asigna runners autoalojados a repos publicos,
    # el job se quedaria encolado para siempre. Runner hospedado por GitHub.
    runs-on: ubuntu-latest
    steps:
      # El GITHUB_TOKEN del runner no puede abrir PRs contra main: el ruleset
      # protect-main-branches exige pull request y solo lo salta un actor con
      # bypass. Se usa la App de la organizacion, igual que el resto de
      # workflows (el prefijo del repo, platform-*, determina APP_ID_PLATFORM).
      - name: Generar token de la App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID_PLATFORM }}
          private-key: ${{ secrets.PRIVATE_KEY_PLATFORM }}
          owner: netexknowledge
          repositories: |
            platform-serverless-terraform-modules

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Tags antes de publicar
        run: git tag | sort > "$RUNNER_TEMP/tags_before.txt"

      # Se usa el CLI de release-please con npx y no googleapis/release-please-action
      # porque la organizacion restringe que actions de terceros pueden
      # ejecutarse: con la action, el workflow ni siquiera arranca
      # (startup_failure, cero jobs). El motor es el mismo.
      - name: Mantener la PR de release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          npx --yes release-please@17 release-pr \
            --token="$GH_TOKEN" \
            --repo-url="${{ github.repository }}" \
            --target-branch=main \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json

      - name: Publicar las releases pendientes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          npx --yes release-please@17 github-release \
            --token="$GH_TOKEN" \
            --repo-url="${{ github.repository }}" \
            --target-branch=main \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json

      # release-please solo crea la tag exacta (<modulo>@X.Y.Z), pero los ~20
      # repos consumidores apuntan a la flotante de major (p.ej. aws-lambda@1),
      # asi que hay que reapuntarla o el cambio no llega a nadie. @latest igual.
      # Se detectan por diferencia de tags en vez de por los outputs del CLI,
      # que no los expone.
      - name: Mover las tags flotantes de major
        run: |
          set -euo pipefail
          git config user.name "sa-github-netex"
          git config user.email "sa-github-netex@users.noreply.github.com"
          git fetch --tags --force --quiet
          git tag | sort > "$RUNNER_TEMP/tags_after.txt"
          nuevas=$(comm -13 "$RUNNER_TEMP/tags_before.txt" "$RUNNER_TEMP/tags_after.txt" \
                   | grep -E '@[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -z "$nuevas" ]; then
            echo "No se ha publicado ninguna version en esta ejecucion."
            exit 0
          fi
          floating=""
          for tag in $nuevas; do
            mod="${tag%@*}"
            ver="${tag##*@}"
            major="${ver%%.*}"
            echo "  $tag -> ${mod}@${major} y ${mod}@latest"
            git tag -f "${mod}@${major}" "$tag"
            git tag -f "${mod}@latest" "$tag"
            floating="$floating refs/tags/${mod}@${major} refs/tags/${mod}@latest"
          done
          # Las flotantes ya existen en el remoto, de ahi el --force.
          git push --force origin $floating

      # Publicacion automatica de patch y minor; los major se quedan esperando
      # a una persona. Un major es, por definicion, el que rompe a los repos
      # consumidores: estos apuntan a la flotante <modulo>@N, que al publicar
      # un major NO se mueve, pero los que usan @latest si se lo comen, y
      # ademas conviene que alguien confirme el salto antes de ofrecerlo.
      # Caso real que motiva esto (2026-10-08): aws-apigateway subio a >= 6.0
      # el provider; publicarlo como minor habria dejado sin terraform init a
      # los 17 repos que consumen aws-apigateway@1.
      - name: Decidir si la release es automatica
        id: decidir
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "${{ github.repository }}" \
                 --state open --label "autorelease: pending" \
                 --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No hay PR de release pendiente."
            echo "accion=ninguna" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          # La comparacion se hace entre el manifest de main y el que propone
          # la PR, no parseando el diff: asi no depende del formato del patch
          # ni del orden de las lineas.
          git show "origin/main:.release-please-manifest.json" > "$RUNNER_TEMP/antes.json"
          gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName \
            --jq .headRefName > "$RUNNER_TEMP/rama.txt"
          git fetch --quiet origin "$(cat "$RUNNER_TEMP/rama.txt")"
          git show "FETCH_HEAD:.release-please-manifest.json" > "$RUNNER_TEMP/despues.json"
          majors=$(python3 - "$RUNNER_TEMP/antes.json" "$RUNNER_TEMP/despues.json" <<'PY'
          import json, sys
          antes = json.load(open(sys.argv[1]))
          despues = json.load(open(sys.argv[2]))
          saltos = [
              f"{mod} {antes[mod]}->{nueva}"
              for mod, nueva in despues.items()
              if mod in antes and nueva.split(".")[0] != antes[mod].split(".")[0]
          ]
          print("; ".join(saltos))
          PY
          )
          if [ -n "${majors// /}" ]; then
            echo "::warning::La PR de release #$pr incluye un major ($majors). No se mergea sola: requiere revision humana."
            echo "accion=manual" >> "$GITHUB_OUTPUT"
          else
            echo "Solo patch/minor: se publica sola."
            echo "accion=auto" >> "$GITHUB_OUTPUT"
          fi

      # El token es el de la App, que el ruleset protect-main-branches ya tiene
      # declarada como bypass actor (Integration 994596). No se salta ningun
      # control: se usa la exencion que la organizacion concedio.
      - name: Publicar la release (solo patch y minor)
        if: steps.decidir.outputs.accion == 'auto'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "${{ steps.decidir.outputs.pr }}" \
            --repo "${{ github.repository }}" --merge --delete-branch

      - name: Avisar de que el major espera a una persona
        if: steps.decidir.outputs.accion == 'manual'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr comment "${{ steps.decidir.outputs.pr }}" \
            --repo "${{ github.repository }}" \
            --body "Esta release incluye un **major**, asi que no se mergea sola: la publicacion automatica solo cubre patch y minor.

          Un major cambia la tag flotante que consumen los repos \`*-terrasam-state\`. Antes de mergear, conviene comprobar que los consumidores pueden adoptarlo (pin del provider, variables nuevas, etc.) y que los que usan \`@latest\` no se lo van a comer sin querer." || true

  notify:
    name: notify
    needs: [release]
    # Repo publico: runner hospedado por GitHub.
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Enviar notificación a Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MESSAGE_PAYLOAD=$(cat <<-EOF
          {
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "❌ ${{ github.repository }}: workflow version falló",
                      "weight": "Bolder",
                      "wrap": true,
                      "color": "Attention"
                    }
                  ],
                  "actions": [
                    {
                      "type": "Action.OpenUrl",
                      "title": "Ver run",
                      "url": "$RUN_URL"
                    }
                  ]
                }
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -d "$MESSAGE_PAYLOAD" "$TEAMS_WEBHOOK_URL"

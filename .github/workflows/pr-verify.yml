name: Commitlint Check

on:
  pull_request:
    # edited incluido: si no, corregir un titulo mal formado no vuelve a
    # lanzar la validacion y el check se queda en rojo para siempre.
    types: [opened, synchronize, reopened, edited]
    branches:
      - "*"

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    # Las PR de release las genera release-please: su titulo y su commit los
    # escribe la maquina, no una persona, asi que validarlos no aporta nada y
    # en cambio puede dejar el ciclo de publicacion bloqueado por su propio
    # lint. Se identifican por la etiqueta autorelease: pending.
    # El bloque >- es necesario: la etiqueta lleva dos puntos y en un escalar
    # plano multilinea YAML lo interpreta como un mapa y rompe el fichero.
    if: >-
      ${{ github.actor != 'sa-github-netex'
      && contains(github.event.pull_request.labels.*.name, 'no_pr_verify') == false
      && contains(github.event.pull_request.labels.*.name, 'autorelease: pending') == false }}
    permissions:
      contents: read
      pull-requests: read
    # Repo publico: GitHub no asigna runners autoalojados a repos publicos,
    # el job se quedaria encolado para siempre. Runner hospedado por GitHub.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      # commitlint se instala al vuelo en vez de usar
      # wagoid/commitlint-github-action porque la organizacion restringe que
      # actions de terceros pueden ejecutarse: con ella el workflow ni siquiera
      # arranca (startup_failure, cero jobs). Node 22 es obligatorio porque
      # commitlint 21 declara engines.node >=22.12.0 y usa built-ins de esa
      # version. Este repo ya no tiene package.json, de ahi el --yes de npx.
      - name: Validar los commits de la PR
        run: |
          npx --yes --package @commitlint/cli@21 --package @commitlint/config-conventional@21 -- \
            commitlint --config=commitlint.config.js \
              --from=${{ github.event.pull_request.base.sha }} \
              --to=${{ github.event.pull_request.head.sha }} --verbose

      # El titulo de la PR acaba siendo el mensaje del commit de merge, asi que
      # se valida con las mismas reglas. Va por variable de entorno y no
      # interpolado en el script para que un titulo con comillas o $() no se
      # ejecute en el runner.
      - name: Validar el titulo de la PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" | npx --yes \
            --package @commitlint/cli@21 --package @commitlint/config-conventional@21 -- \
            commitlint --config=commitlint.config.js --verbose
